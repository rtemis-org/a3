name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

# The repository default grants GITHUB_TOKEN read-only access. TagBot pushes
# the tag over SSH (TAGBOT_KEY) and creates the GitHub release with
# GITHUB_TOKEN, which requires contents: write.
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: write
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest

    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.TAGBOT_KEY }}
          subdir: julia/RtemisA3
