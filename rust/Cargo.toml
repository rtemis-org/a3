[package]
name = "rtemis-a3"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Rust implementation of the A3 (Amino Acid Annotation) format — parse, validate, and inspect A3 JSON files"
license = "BSD-3-Clause"
repository = "https://github.com/rtemis-org/a3"
homepage = "https://a3.rtemis.org"
documentation = "https://docs.rs/rtemis-a3"
readme = "README.md"
keywords = ["bioinformatics", "protein", "amino-acid", "proteomics", "json"]
categories = ["science::bioinformatics::proteomics", "parser-implementations", "command-line-utilities"]

[[bin]]
name = "a3"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "3"
# Annotation names are author-supplied and their order is part of the document;
# HashMap iteration order is nondeterministic, so serializing the same parsed
# document twice would produce two different files.
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps a parsed object's member order, which variant records
# need: everything beyond `position` round-trips verbatim, in document order.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
