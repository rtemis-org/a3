[package]
name = "a3-corpus-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Generates the A3 conformance corpus in spec/conformance/"
license = "BSD-3-Clause"
publish = false

[[bin]]
name = "a3-corpus-generator"
path = "src/main.rs"

[dependencies]
# The reference implementation. The generator uses it to produce each
# `normalized` companion, so normalization has five implementations rather than
# six. Expected *issues* are hand-declared and never come from here — otherwise
# the corpus would be a snapshot of Rust's behavior rather than a spec.
rtemis-a3 = { path = "../../../rust" }
serde_json = { version = "1", features = ["preserve_order"] }
